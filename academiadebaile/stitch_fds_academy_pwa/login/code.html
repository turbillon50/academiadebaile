<style>
      body {
        background-color: #000000;
        color: #e2e2e2;
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
      }
      .glass-surface {
        background: rgba(18, 20, 20, 0.4);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);

<body class="flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container">
<!-- Subtle atmospheric stage background -->
<div class="fixed inset-0 pointer-events-none stage-gradient z-0"></div>
<main class="relative z-10 flex-1 flex flex-col items-center justify-center px-container-margin py-section-margin">
<!-- Logo Section -->
<div class="mb-8 logo-glow">
<img alt="FDS Academy Logo" class="w-32 h-32 md:w-40 md:h-40 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDuYJPzP35UsuG_ZWlphLK2vb0fGqIImYMuwnVRnbWm6mghTVSwj49JgN9WUxM9B2PJZDoRYGov6mYj08-ynT3Fpf8qewXflVRUvF12d6iesT0iW7ELl5DqtqvKCeDKMveH9edstXezjU5bbnfqKgb2bc4ZnuyTiodmc2lGlr1BEn0rpv1lkLERfUNxz3KDWvH0O37RREIvLDH6AT157RiwzxM6xpSuwQM_EusYFMUzMUQe1YhuJYtwNTS43LufTSYAbB5ncbj4PH6e"/>
</div>
<!-- Welcome Text -->
<div class="text-center mb-section-margin">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2">
                Bienvenido a la academia
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Tu disciplina define tu movimiento.
            </p>
</div>
<!-- Login Form Container -->
<div class="w-full max-w-sm glass-surface p-glass-padding rounded-xl">
<form action="#" class="space-y-stack-gap" method="POST">
<!-- Email Field -->
<div class="space-y-1">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1" for="email">Correo electrónico</label>
<div class="relative">
<input class="w-full bg-[#1C1C1E] border-none rounded-lg py-3 px-4 text-on-surface focus:ring-1 focus:ring-primary input-transition placeholder:text-outline-variant" id="email" name="email" placeholder="tu@correo.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1" for="password">Contraseña</label>
<div class="relative group">
<input class="w-full bg-[#1C1C1E] border-none rounded-lg py-3 px-4 text-on-surface focus:ring-1 focus:ring-primary input-transition placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<div class="flex justify-end pt-1">
<a class="font-label-bold text-[12px] text-primary hover:opacity-80 transition-opacity" href="#">
                            Olvidé mi contraseña
                        </a>
</div>
</div>
<!-- Primary Button -->
<button class="w-full bg-primary-container text-on-primary-container font-label-bold text-label-bold py-4 rounded-full active:scale-95 transition-transform duration-200 mt-2 shadow-lg shadow-primary-container/20" type="submit">
                    Iniciar sesión
                </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-6">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink mx-4 font-label-bold text-[12px] text-on-surface-variant">O continúa con</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 bg-[#1C1C1E] hover:bg-surface-container-high py-3 rounded-lg border border-white/5 transition-colors group">

</svg>
<span class="font-label-bold text-label-bold text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-2 bg-[#1C1C1E] hover:bg-surface-container-high py-3 rounded-lg border border-white/5 transition-colors group">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.88-3.12 1.87-2.39 5.91.71 7.15-.65 1.62-1.52 3.01-2.76 3.98zM12.03 7.25c-.02-2.23 1.76-4.07 3.9-4.25.3 2.51-2.04 4.46-3.9 4.25z"></path>
</svg>
<span class="font-label-bold text-label-bold text-on-surface">Apple</span>

</p>

<!-- Visual Accents -->
<div class="fixed top-0 right-0 w-64 h-64 bg-primary/5 rounded-full blur-[120px] -translate-y-1/2 translate-x-1/2 pointer-events-none"></div>
<div class="fixed bottom-0 left-0 w-80 h-80 bg-primary/5 rounded-full blur-[140px] translate-y-1/2 -translate-x-1/2 pointer-events-none"></div>
<script>
        // Simple micro-interaction for password visibility
        const visibilityBtn = document.querySelector('button span.material-symbols-outlined');
        const passwordInput = document.querySelector('#password');
        
        if (visibilityBtn && passwordInput) {
            visibilityBtn.parentElement.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                visibilityBtn.textContent = isPassword ? 'visibility_off' : 'visibility';
            });
        }

        // Form submission subtle scale effect
        const loginBtn = document.querySelector('button[type="submit"]');
        loginBtn.addEventListener('click', (e) => {
            // e.preventDefault(); // Uncomment for testing UI
        });
    </script>
</body></html>
